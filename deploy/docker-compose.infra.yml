## 本地开发基础设施：PostgreSQL / Redis / MinIO
## 用法：docker compose -f deploy/docker-compose.infra.yml up -d
## 后端与前端在宿主机本地运行，见 spec §9.3。
##
## MinIO 是 spec §5.10 / §9.1 的既定架构（对象存储），因此**保留**在这个编排里：
## 当前后端走的是「可替换的本地目录实现」，切到对象存储时只需换掉存储实现，
## 接口不变、业务侧不感知。所以这里不是「没人连的僵尸服务」，而是切换时现成的落点。

services:
  postgres:
    image: postgres:16-alpine
    container_name: xa-todo-postgres
    environment:
      POSTGRES_DB: xatodo
      POSTGRES_USER: xatodo
      POSTGRES_PASSWORD: xatodo
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - xa-todo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xatodo -d xatodo"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: xa-todo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - xa-todo-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: xa-todo-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: xatodo
      MINIO_ROOT_PASSWORD: xatodo123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - xa-todo-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  xa-todo-pgdata:
  xa-todo-redisdata:
  xa-todo-miniodata:
