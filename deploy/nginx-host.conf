# 宿主 nginx 站点配置（目标机 80/443 已被别的站点占用，因此用 8088）。
# 实际部署时放到 /etc/nginx/conf.d/xatodo.conf，先 nginx -t 再 reload。
server {
    listen 8088;
    server_name _;

    root /opt/xatodo/web/dist;
    index index.html;

    client_max_body_size 12m;

    # SPA：前端路由都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口与静态资源（/uploads 是 <Image> 直连、/map 是地图 WebView 直连）
    #
    # 小安的对话是 SSE：**必须单独关掉缓冲**。否则 nginx 会把整条流缓冲到结束再吐，
    # 「流式回答」在用户那里变成「转半天圈、然后一次性蹦出来」——功能没坏，体验全丢。
    # 前缀更长，所以会盖住下面的 /api/。
    location /api/v1/ai/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 助手整条流的上限是 90s，这里给足余量（转写 + 工具循环）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    location /map/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
    }

    # 应用内更新的安装包（spec §4.1.11）：**直接由 nginx 发静态文件**，不过后端。
    # 几十 MB 的包让 JVM 转发纯属浪费；而且 nginx 天生支持 Range（断点续传）。
    # 发布用 scripts/publish_apk.sh：它会把包传到 /opt/xatodo/web/downloads/，
    # 并算好大小与 sha256 提示你写进 .env。
    #
    # no-store：包名里带版本号，每次发布都是新 URL，不该让中间层缓存一个几十 MB 的旧包
    # （缓存住旧包 = 用户点了更新装回去的还是老版本，这种问题极难查）。
    location /downloads/ {
        alias /opt/xatodo/web/downloads/;
        autoindex off;
        add_header Cache-Control "no-store" always;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }
}
