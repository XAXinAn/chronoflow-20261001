server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 批量导入模板/文件上传留些余量（图片单文件上限 5MB，见 spec §5.10）
    client_max_body_size 12m;

    # SPA：前端路由（/organizations、/org/members…）都回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 小安的对话是 SSE：**必须单独关掉缓冲**，否则 nginx 会把整条流缓冲到结束再吐，
    # 「流式回答」在用户那里变成「转半天圈、然后一次性蹦出来」——功能没坏，体验全丢。
    # 前缀更长，所以会盖住下面的 /api/。这条在宿主 nginx 版（deploy/nginx-host.conf）里
    # 早就有了，容器版一直漏着（新服务器走容器 nginx，才暴露出来）。
    location /api/v1/ai/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        # 助手整条流的上限是 90s，这里给足余量（转写 + 工具循环）
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 后端接口：同源转发，前端因此不用处理跨域
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 这两条必须也能直连：App 的 <Image> 与地图 WebView 带不了 Authorization（spec §5.10 / §5.9）
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    location /map/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
    }

    # 应用内更新的安装包（spec §4.1.11）：静态文件直发，不过后端。
    # 包放进 web/dist/downloads/ 就会随前端镜像一起进 /usr/share/nginx/html。
    location /downloads/ {
        autoindex off;
        add_header Cache-Control "no-store" always;
        types { application/vnd.android.package-archive apk; }
        default_type application/octet-stream;
    }
}
