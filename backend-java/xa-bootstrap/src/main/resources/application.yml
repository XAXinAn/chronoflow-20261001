server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: xa-todo-backend
  profiles:
    default: dev
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xatodo}
    username: ${DB_USERNAME:xatodo}
    password: ${DB_PASSWORD:xatodo}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: xa-todo-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

xatodo:
  version: ${XATODO_VERSION:0.1.0-SNAPSHOT}
  admin:
    # 首次启动且 admin_user 表为空时创建初始超管；生产环境务必用环境变量覆盖密码
    bootstrap-username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    bootstrap-password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123456}
  auth:
    jwt-secret: ${JWT_SECRET:xa-todo-development-secret-key-change-me-in-production}
    # 会话保持策略见 spec §3.7：刷新令牌滑动续期，正常使用不会被打断
    access-token-ttl: 2h
    refresh-token-ttl: 90d
    refresh-rotation-grace: 60s
    register-token-ttl: 30m
    select-token-ttl: 30m
    sms-code-ttl: 5m
    sms-send-interval: 60s
    sms-daily-limit-per-phone: 10
    sms-daily-limit-per-ip: 30
    sms-max-verify-attempts: 5
    max-devices-per-identity: 5
    # 生产环境必须保持 false；无短信通道时仅开发/测试开启
    expose-sms-code: false
  geo:
    # 期望的服务商。没配 Key 时自动降级为内置地点集，并在 /geo/config 里如实上报，
    # 保证离线环境与 CI 也能跑通「搜索地点 → 落库带坐标」的完整链路（spec §5.9）
    provider: ${GEO_PROVIDER:amap}
    amap:
      key: ${GEO_AMAP_KEY:}
      # 地图选点用的 Web端(JS API) 凭证。和上面的 Web 服务 Key 是两套，缺了只影响地图选点。
      js-key: ${GEO_AMAP_JS_KEY:}
      js-security-code: ${GEO_AMAP_JS_SECURITY_CODE:}
      base-url: ${GEO_AMAP_BASE_URL:https://restapi.amap.com}
      timeout-seconds: ${GEO_AMAP_TIMEOUT_SECONDS:5}
  holiday:
    # 节假日数据的进程内缓存时长（spec §5.11）。数据由 scripts/load_holidays.py 灌库，
    # 热更新的可见延迟上限就是这个 TTL：不想等就重启服务，或把 TTL 调小。
    cache-ttl: ${HOLIDAY_CACHE_TTL:5m}
    sync:
      # 每天自动从 holiday-cn 拉当年 + 次年的放假安排（幂等 upsert）。
      # 数据只有几十条、上游一年动几次，每天跑一次几乎没有代价，但能消掉「忘了更新」这类事故。
      # 测试里显式关掉：单元测试不该依赖外网。
      enabled: ${HOLIDAY_SYNC_ENABLED:true}
      # 每天凌晨 3:10（东八区）同步；cron 是 6 段式（秒 分 时 日 月 周）
      cron: ${HOLIDAY_SYNC_CRON:0 10 3 * * *}
      zone: ${HOLIDAY_SYNC_ZONE:Asia/Shanghai}
      # 启动后也补跑一次：新部署或刚重建库时不必等到凌晨
      run-on-startup: ${HOLIDAY_SYNC_RUN_ON_STARTUP:true}
      startup-delay: ${HOLIDAY_SYNC_STARTUP_DELAY:30s}
      # 上游地址可覆盖，便于指向内网镜像
      base-url: ${HOLIDAY_SYNC_BASE_URL:https://raw.githubusercontent.com/NateScarlet/holiday-cn/master}
      timeout: ${HOLIDAY_SYNC_TIMEOUT:15s}
  upload:
    # 图片上传目录（spec §5.10）。首版是本地目录 + /uploads/** 静态映射，
    # 换 MinIO/OSS 时接口不变、只替换存储实现。
    dir: ${XATODO_UPLOAD_DIR:./data/uploads}
    max-bytes: ${XATODO_UPLOAD_MAX_BYTES:5242880}
  ai:
    vision:
      # 本地轻量多模态识别（spec §4.1.9）：指向**本机/内网**的 OpenAI 兼容推理服务，
      # 比如 ollama 起的 http://localhost:11434/v1 + qwen2.5vl:3b。
      # 留空表示未接入：那时 /ai/events/recognize 返回 90002，App 会明说「识别未接入」。
      base-url: ${XATODO_VISION_BASE_URL:}
      model: ${XATODO_VISION_MODEL:}
      api-key: ${XATODO_VISION_API_KEY:}
      timeout-seconds: ${XATODO_VISION_TIMEOUT_SECONDS:60}
      timezone: Asia/Shanghai

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
