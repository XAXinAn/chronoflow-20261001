server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: xa-todo-backend
  profiles:
    default: dev
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xatodo}
    username: ${DB_USERNAME:xatodo}
    password: ${DB_PASSWORD:xatodo}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: xa-todo-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

xatodo:
  version: ${XATODO_VERSION:0.1.0-SNAPSHOT}

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
