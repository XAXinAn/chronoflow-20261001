server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: xa-todo-backend
  profiles:
    default: dev
  jackson:
    time-zone: UTC
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xatodo}
    username: ${DB_USERNAME:xatodo}
    password: ${DB_PASSWORD:xatodo}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: xa-todo-pool
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      connect-timeout: 3s
  lifecycle:
    timeout-per-shutdown-phase: 20s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

xatodo:
  version: ${XATODO_VERSION:0.1.0-SNAPSHOT}
  auth:
    jwt-secret: ${JWT_SECRET:xa-todo-development-secret-key-change-me-in-production}
    access-token-ttl: 30m
    refresh-token-ttl: 30d
    register-token-ttl: 10m
    select-token-ttl: 10m
    sms-code-ttl: 5m
    sms-send-interval: 60s
    sms-daily-limit-per-phone: 10
    sms-daily-limit-per-ip: 30
    sms-max-verify-attempts: 5
    max-devices-per-identity: 5
    # 生产环境必须保持 false；无短信通道时仅开发/测试开启
    expose-sms-code: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{traceId:-}]"
