# 本地开发默认连接 docker compose 启动的 PostgreSQL（spec §9.3）
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/xatodo}
    username: ${DB_USERNAME:xatodo}
    password: ${DB_PASSWORD:xatodo}

xatodo:
  auth:
    # 开发环境无短信通道，回显验证码便于联调
    expose-sms-code: true

logging:
  level:
    com.xatodo: DEBUG
