name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一分支的新推送取消上一次未完成的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端（Java 21）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 测试自带嵌入式 PostgreSQL 与嵌入式 Redis，因此不需要 service 容器，
      # 也不需要任何外部依赖即可跑完整集成测试。
      # OpenApiContractTest 会校验 contract/api-contract.json 的覆盖与鉴权行为，
      # 因此这一步同时是契约门禁。
      - name: 构建与测试
        run: mvn -B clean verify
        working-directory: backend-java

      - name: 上传 OpenAPI 文档
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend-java/xa-bootstrap/target/openapi/xatodo-api.json
          if-no-files-found: error

  frontend:
    name: 前端（design-tokens / web-admin / app）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      # 顺序有依赖：web-admin 与 app 都消费 design-tokens 的构建产物
      - name: 构建设计令牌
        run: npm run build -w @xa-todo/design-tokens

      - name: 构建 Web 后台
        run: npm run build -w @xa-todo/web-admin

      - name: App 类型检查
        run: npm run typecheck

      # 令牌、Web 后台、App 逻辑层的全部单测
      - name: 运行测试
        run: npm test
